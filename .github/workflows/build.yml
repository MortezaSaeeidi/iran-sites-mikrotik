name: build-mikrotik
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build domain lists
        env:
          DNS_IP: ${{ vars.DNS_IP || '178.22.122.100' }}
        run: ./scripts/build.sh
      - name: Build IPv4 list
        run: ./scripts/build-ip.sh
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add iran-ir.rsc iran-full.rsc iran-ip.rsc
          git diff --cached --quiet && exit 0
          git commit -m "Update lists $(date -u +%F)"
          git push
